<div id="approval-{{.CorrelationID}}" data-resolved="true" style="padding: 0.85rem 1rem; border-radius: var(--radius-md); background: var(--bg-surface-elevated); border: 1px solid var(--border-subtle); font-family: var(--font-mono); font-size: 0.75rem; text-align: center; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
    {{ if .IsRejected }}
    <span style="width: 7px; height: 7px; border-radius: 9999px; background: var(--status-rose);"></span>
    <span style="color: var(--status-rose); font-weight: 700;">RESOLVED // OPERATOR DECISION: DENIED</span>
    {{ else if .IsAutoApprove }}
    <span style="width: 8px; height: 8px; border-radius: 9999px; background: #fff;"></span>
    <span style="color: var(--text-primary); font-weight: 700;">RESOLVED // ⚡ AUTO-APPROVED &amp; AUTO-PILOT ON</span>
    {{ else }}
    <span style="width: 7px; height: 7px; border-radius: 9999px; background: var(--status-emerald);"></span>
    <span style="color: var(--status-emerald); font-weight: 700;">RESOLVED // OPERATOR DECISION: {{.Decision}}</span>
    {{ end }}
</div>
