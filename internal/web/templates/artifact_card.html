<div class="artifact-card" style="animation: fadeIn 0.2s ease-out;">
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem;">
        <div style="display: flex; flex-direction: column; gap: 0.25rem; min-width: 0;">
            <div style="display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap;">
                <span class="artifact-type-badge">{{.ArtifactType}}</span>
                <span style="font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-dim);">{{.Time}}</span>
            </div>
            <span class="artifact-filename">{{.Filename}}</span>
            <span style="font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-muted);">agent <span style="font-weight: 700; color: var(--text-secondary);">{{.Agent}}</span></span>
        </div>
    </div>
    <div class="artifact-actions">
        <button onclick="openArtifactViewer('{{.Path}}', '{{.Filename}}', '{{.ArtifactType}}', '{{.Agent}}')"
                class="btn-artifact-preview">
            Preview
        </button>
        <a href="/api/artifact?path={{.Path}}" target="_blank"
           class="btn-artifact-download">
            Download
        </a>
    </div>
</div>
<script>document.getElementById('artifacts-empty')?.remove();</script>
