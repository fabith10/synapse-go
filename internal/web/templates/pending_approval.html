<div id="approval-{{.CorrelationID}}" class="hitl-card">
    <div class="hitl-header">
        <div class="hitl-title-row">
            <span class="hitl-alert-label">
                <span class="hitl-ping-dot"></span> Approval Required (HITL Gate)
            </span>
            <span class="hitl-sender font-mono">{{.Sender}} ──▶ {{.Metadata.action}}</span>
        </div>
        <span class="hitl-risk-badge">
            {{.Metadata.risk_level}} RISK
        </span>
    </div>
    
    <div id="approval-content-{{.CorrelationID}}" class="hitl-content-box" data-raw="{{.Content}}" data-b64="{{.RawB64}}">
        {{.Content}}
    </div>

    <!-- Approval form using htmx POST, replacing the parent card with response HTML -->
    <form hx-post="/api/hitl/respond" hx-target="#approval-{{.CorrelationID}}" hx-swap="outerHTML" class="hitl-actions-row">
        <input type="hidden" name="correlation_id" value="{{.CorrelationID}}">
        <button type="submit" name="decision" value="REJECTED" class="btn-hitl-deny">
            Deny Execution
        </button>
        <button type="submit" name="decision" value="APPROVED" class="btn-hitl-approve">
            Approve &amp; Continue
        </button>
        <button type="submit" name="decision" value="APPROVE_ALL" class="btn-hitl-autopilot" title="Approve this request and enable Auto-Pilot for all future actions">
            <span>⚡</span> Auto-Approve All
        </button>
    </form>
</div>
<script>(function(){
  var el = document.getElementById("approval-content-{{.CorrelationID}}");
  if (!el) return;
  var raw = (typeof getRawContent === "function") ? getRawContent(el) : (el.getAttribute("data-b64") ? atob(el.getAttribute("data-b64")) : (el.getAttribute("data-raw") || ""));
  if (typeof renderMarkdown === "function") {
      el.innerHTML = renderMarkdown(raw);
  } else {
      el.textContent = raw;
  }
})();</script>
