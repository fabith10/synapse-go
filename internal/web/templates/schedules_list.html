{{ define "schedules-list-tmpl" }}
    {{ if . }}
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem;">
            {{ range . }}
            <div id="schedule-card-{{.ID}}" class="glass-panel" style="padding: 1.25rem; display: flex; flex-direction: column; justify-content: space-between; gap: 1rem; border-left: 3px solid var(--accent-primary);">
                <div style="display: flex; flex-direction: column; gap: 0.65rem;">
                    <div style="display: flex; align-items: center; justify-content: space-between;">
                        <span style="font-family: var(--font-mono); font-size: 0.8rem; font-weight: 700; color: var(--text-primary); text-transform: uppercase; letter-spacing: 0.05em;">{{.Name}}</span>
                        <span style="font-family: var(--font-mono); font-size: 0.62rem; font-weight: 700; color: var(--status-emerald); background: var(--status-emerald-bg); border: 1px solid var(--status-emerald-border); padding: 0.15rem 0.5rem; border-radius: var(--radius-full); text-transform: uppercase;">Active</span>
                    </div>
                    <div style="font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-secondary);">
                        Cron: <span style="font-weight: 700; color: var(--text-primary); background: var(--bg-hover); padding: 0.15rem 0.35rem; border-radius: var(--radius-sm);">{{.Cron}}</span>
                    </div>
                    <div style="font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-secondary);">
                        Next Fire: <span style="font-weight: 700; color: var(--status-emerald);">{{.NextFire}}</span>
                    </div>
                    <div style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-secondary); background: var(--bg-app); border: 1px solid var(--border-subtle); padding: 0.75rem; border-radius: var(--radius-md); line-height: 1.5; max-height: 100px; overflow-y: auto;">
                        {{.Task}}
                    </div>
                </div>
                <button hx-delete="/api/schedules/{{.ID}}" hx-target="#schedules-list" hx-swap="innerHTML" style="width: 100%; padding: 0.5rem; background: var(--status-rose-bg); border: 1px solid var(--status-rose-border); color: var(--status-rose); border-radius: var(--radius-md); font-family: var(--font-mono); font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer; transition: all var(--transition-fast);">
                    Delete Schedule
                </button>
            </div>
            {{ end }}
        </div>
    {{ else }}
        <div style="padding: 2.5rem 1rem; border: 1px dashed var(--border-medium); border-radius: var(--radius-lg); text-align: center; font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); background: var(--bg-app);">
            NO RECURRING CRON SCHEDULES REGISTERED
        </div>
    {{ end }}
{{ end }}
