<div class="log-entry"
     data-sender="{{.Sender}}"
     data-recipient="{{.Recipient}}"
     data-event-type="{{.EventType}}"
     data-category="{{.Category}}"
     data-tool="{{.ActiveTool}}"
     data-model="{{.Model}}">
    
    <div class="log-entry-meta">
        <div style="display: flex; align-items: center; gap: 0.4rem;">
            <span style="color: var(--text-dim);">[{{.Time}}]</span>
            <span style="font-weight: 700; color: var(--text-primary);" data-sender="{{.Sender}}">{{.Sender}}</span>
            <span style="color: var(--text-dim);">➔</span>
            <span style="color: var(--text-muted);" data-recipient="{{.Recipient}}">{{.Recipient}}</span>
        </div>
        <div style="display: flex; align-items: center; gap: 0.4rem;">
            {{if .Model}}
            <span style="font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-dim); background: var(--bg-surface); padding: 0.08rem 0.35rem; border-radius: 4px; border: 1px solid var(--border-subtle);">
                {{.Model}}
            </span>
            {{end}}
            {{if .ActiveTool}}
            <span style="color: var(--status-cyan); background: var(--status-cyan-dim); border: 1px solid var(--status-cyan-border); padding: 0.1rem 0.35rem; border-radius: 4px; font-weight: 600;">
                ⚡ {{.ActiveTool}}
            </span>
            {{end}}
            <span style="padding: 0.1rem 0.35rem; border-radius: 4px; font-weight: 600; text-transform: uppercase;
                {{if eq .EventType "TOOL_CALL"}}background: var(--border-subtle); color: var(--text-primary);
                {{else if eq .EventType "QA_EVAL"}}background: var(--status-amber-dim); color: var(--status-amber);
                {{else if or (eq .EventType "TASK_COMPLETE") (eq .EventType "SUBTASK_COMPLETE")}}background: var(--status-emerald-dim); color: var(--status-emerald);
                {{else}}background: var(--bg-app); color: var(--text-muted);{{end}}">
                {{.EventType}}
            </span>
        </div>
    </div>

    <div class="md-content" style="color: var(--text-secondary); font-size: 0.75rem; line-height: 1.5; word-break: break-word;" data-raw="{{.Content}}" data-b64="{{.RawB64}}"></div>
</div>
